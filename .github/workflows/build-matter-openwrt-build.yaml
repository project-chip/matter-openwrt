name: build matter-openwrt-build container

on:
  pull_request:
    paths:
      - .containers/matter-openwrt-build/**
      - .github/workflows/build-matter-openwrt-build.yaml
  push:
    paths:
      - .containers/matter-openwrt-build/**
      - .github/workflows/build-matter-openwrt-build.yaml
  workflow_dispatch:
    inputs:
      openwrt-version-override:
        type: string
        description: OpenWrt version number override
      openwrt-target:
        type: string
        description: OpenWrt SDK target (e.g. armsr-armv8)
        default: x86-generic

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine OpenWrt version
        uses: ./.github/actions/openwrt-version
        with:
          openwrt-version-override: ${{ inputs.openwrt-version-override }}

      - name: Determine target and tags
        run: |
          target="${{ inputs.openwrt-target || 'x86-generic' }}"
          if [[ "$target" == x86-generic ]]; then
            # Tags without a target name and `latest` are x86-generic
            tags="${{ inputs.openwrt-version-override && '' || 'latest,' }}$OPENWRT_VERSION"
          else
            tags="$target-$OPENWRT_VERSION"
          fi
          echo "OPENWRT_TARGET=$target" >>"$GITHUB_ENV"
          echo "IMAGE_TAGS=$tags" >>"$GITHUB_ENV"

      - name: Build and push
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: project-chip/matter-openwrt-build
          context: .containers/matter-openwrt-build
          buildargs: OPENWRT_VERSION,OPENWRT_TARGET
          registry: ghcr.io
          tags: ${{ env.IMAGE_TAGS }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          no_push: ${{ github.repository_owner != 'project-chip' || github.event_name == 'pull_request' || github.event.ref != 'refs/heads/main' }}
